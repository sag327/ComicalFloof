<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASSCII</title>
<style>
  :root {
    --paper: #f4efe4;
    --mat: #fbf8f1;
    --ink: #2b2620;
    --soft: #8a7f70;
    --line: #d9d0be;
    --accent: #a4532a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17150f;
      --mat: #1f1c15;
      --ink: #eadfc8;
      --soft: #8f866f;
      --line: #3a3528;
      --accent: #e0a070;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 3vh, 28px);
    padding: 24px 12px;
  }
  header { text-align: center; }
  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(26px, 5vw, 44px);
    letter-spacing: 0.42em;
    margin-right: -0.42em; /* balance the trailing letter-space */
  }
  .tagline {
    margin: 8px 0 0;
    font-style: italic;
    color: var(--soft);
    font-size: clamp(12px, 1.8vw, 15px);
  }
  .frame {
    appearance: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
    background: var(--mat);
    border: 1px solid var(--line);
    outline: 1px solid var(--line);
    outline-offset: 6px;
    padding: clamp(10px, 2.5vw, 28px) clamp(8px, 2.5vw, 30px);
    margin: 6px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .frame:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
  #donkey {
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Courier New", monospace;
    font-size: clamp(7px, 2.9vw, 17px);
    line-height: 1.18;
    white-space: pre;
    text-align: left;
    user-select: none;
    will-change: transform, opacity;
  }
  .plaque { text-align: center; min-height: 3.2em; }
  #title { margin: 0; font-size: clamp(15px, 2.4vw, 19px); }
  #meta {
    margin: 5px 0 0;
    color: var(--soft);
    font-size: clamp(11px, 1.6vw, 13px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  footer {
    color: var(--soft);
    font-size: clamp(11px, 1.6vw, 13px);
    font-style: italic;
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .creator-credit { color: var(--soft); font: normal 11px/1.5 Georgia, "Iowan Old Style", "Times New Roman", serif; text-align: center; }
  #copy {
    font: inherit;
    color: var(--accent);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
</style>
<style>.cf-suggest{display:inline-block;margin:12px 4px 4px;padding:7px 13px;border:2px solid #422746;border-radius:30px;background:#fff36f;color:#422746!important;font:800 12px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0;text-decoration:none!important;text-transform:none;box-shadow:2px 3px 0 #422746;animation:cfwob 2.6s ease-in-out infinite;white-space:nowrap}.cf-suggest:hover,.cf-suggest:focus-visible{animation-duration:.45s}@keyframes cfwob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media(prefers-reduced-motion:reduce){.cf-suggest{animation:none}}</style>
</head>
<body>
  <header>
    <h1>ASSCII</h1>
    <p class="tagline">tasteful donkeys, rendered in plain text</p>
  </header>

  <button class="frame" id="frame" aria-label="Donkey portrait. Activate for a new donkey.">
    <pre id="donkey" aria-hidden="true"></pre>
  </button>

  <div class="plaque" aria-live="polite">
    <p id="title"></p>
    <p id="meta"></p>
  </div>

  <footer>
    <span>click the donkey for another</span>
    <button id="copy" type="button">copy this one</button>
  <a class="cf-suggest" href="suggestionbox.html">💡 Suggest things. We dare you.</a></footer>
  <div class="creator-credit" aria-label="Creator credit">Created by NicoBot 🤖<br>© 2026 NicoBot. All rights reserved.</div>

<script>
/* ============================================================
   ASSCII donkey generator
   Each donkey is assembled on a character grid from hand-drawn
   parts (pose, ears, mane, tail, legs, extras, scenery), drawn
   facing right, then optionally mirrored.
   ============================================================ */
var ASSCII = (function () {
  var W = 48, H = 16;          // canvas size in characters
  var GROUND = H - 2;          // first ground row; art rests on the row above

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function chance(p) { return Math.random() < p; }
  function rand(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }

  function blank() {
    var g = [];
    for (var r = 0; r < H; r++) { g.push(new Array(W).fill(' ')); }
    return g;
  }
  // Draw rows of text at (row, col). Spaces are transparent unless solid.
  function put(g, row, col, lines, solid) {
    for (var i = 0; i < lines.length; i++) {
      for (var j = 0; j < lines[i].length; j++) {
        var ch = lines[i][j], r = row + i, c = col + j;
        if (r < 0 || r >= H || c < 0 || c >= W) continue;
        if (ch !== ' ' || solid) g[r][c] = ch;
      }
    }
  }
  // True if a w-by-h box at (row, col) stays clear of everything drawn so far.
  function free(g, row, col, w, h, margin) {
    if (row < 0 || col < 0 || col + w > W || row + h > GROUND) return false;
    for (var r = row; r < row + h; r++) {
      var lo = -1, hi = -1;
      for (var c = 0; c < W; c++) { if (g[r][c] !== ' ') { if (lo < 0) lo = c; hi = c; } }
      if (lo >= 0 && col <= hi + margin && col + w - 1 >= lo - margin) return false;
    }
    return true;
  }
  function width(lines) { return Math.max.apply(null, lines.map(function (l) { return l.length; })); }
  // Try random spots for a piece of scenery; draw it at the first clear one.
  function place(g, lines, rowLo, rowHi, margin) {
    var w = width(lines);
    for (var i = 0; i < 30; i++) {
      var r = rand(rowLo, rowHi), c = rand(0, W - w);
      if (free(g, r, c, w, lines.length, margin)) { put(g, r, c, lines); return true; }
    }
    return false;
  }

  /* ---------- shared parts ---------- */
  var EYES = ['o', 'o', 'o', 'O', '^', '-', '*', '='];
  var MANES = ['}}', '))', '%%', '||', '\\\\', '##'];

  var EARS_TALL = [
    ["   /|  /|", "  / | / |", " /  |/  |"],
    ["   /|", "  / |  ,--.", " /  | /  _.'"],
    ["  |\\  |\\", "  | \\ | \\", "  |  \\|  \\"]
  ];
  var LEGS = [
    ["|  |  |        |  |  |",
     "|  |  |        |  |  |",
     "|__|__|        |__|__|"],
    ["|  |  |        |  |  |",
     "|  |  |        |  |  |",
     "|##|##|        |##|##|"],
    ["|  |\\  \\      /  /|  |",
     "|  | \\  \\    /  / |  |",
     "|__|  \\__\\  /__/  |__|"],
    ["|  |  |        |  | /  /",
     "|  |  |        |  |/__/",
     "|__|__|        |__|"]
  ];
  // drawn so the last character of the first row touches the rump
  var TAILS = [
    ["    /", "   /", "  ~"],
    ["    /", "   /", "  /", " ~"],
    ["    {", "   {", "  {", "  *"],
    [" ~-._"]
  ];

  /* ---------- poses (drawn facing right; E = eye, M = mane) ----------
     rows:  number of canvas rows the pose occupies (it sits on the ground)
     x:     [min, max] horizontal offset
     back:  art row of the back line, for things that sit on it        */
  var POSES = {
    standing: {
      weight: 30, rows: 13, x: [1, 3], back: 4,
      art: [
        "", "", "",
        "                       /        \\__",
        "         ____________.'    E       ''-.",
        "     .-''           MM                 \\",
        "     |              MM          .__  o  )",
        "     |              MM       .-'   '---'",
        "     |                     /",
        "     |      ________      |"
      ],
      ears: { row: 0, col: 23, set: EARS_TALL },
      legs: { row: 10, col: 5, set: LEGS },
      tail: { row: 6, set: TAILS },
      mouth: { row: 7, col: 40 },
      fly: { row: 2, col: 41 }
    },
    grazing: {
      weight: 16, rows: 9, x: [1, 2], back: 0,
      art: [
        "         _______________",
        "     .-''               ''-.",
        "     |              MM        '.",
        "     |              MM          \\",
        "     |                MM         '     '.",
        "     |      ________       '.        E   \\",
        "                             \\            |",
        "                              '.     __  o )",
        "                                '---'  '--'"
      ],
      ears: { row: 2, col: 34, set: [
        ["   /|/|", "  / / |"],
        [" |\\ |\\", " | \\| \\"]
      ] },
      legs: { row: 6, col: 5, set: LEGS.slice(0, 3) },
      tail: { row: 2, set: TAILS },
      fly: { row: 2, col: 43 }
    },
    resting: {
      weight: 14, rows: 10, x: [1, 3], back: 4,
      art: [
        "", "", "",
        "                       /        \\__",
        "         ____________.'    E       ''-.",
        "     .-''           MM                 \\",
        "    /               MM          .__  o  )",
        " ~-(                MM       .-'   '---'",
        "    \\     __________       _/",
        "     '---(______(____'-----(_____)"
      ],
      ears: { row: 0, col: 23, set: EARS_TALL },
      mouth: { row: 7, col: 40 },
      fly: { row: 2, col: 41 }
    },
    sitting: {
      weight: 14, rows: 14, x: [1, 4], props: true,
      art: [
        "", "", "",
        "               /        \\__",
        "             .'    E       ''-.",
        "           .'MM                \\",
        "          / MM          .__  o  )",
        "         / MM        .-'   '---'",
        "        /           /",
        "      .'           |",
        "     /     .--.    | |",
        "    |     /    \\   | |",
        " ~-.|    |      |  | |",
        "    '.___|______|__|_|"
      ],
      ears: { row: 0, col: 15, set: EARS_TALL },
      mouth: { row: 7, col: 32 },
      fly: { row: 2, col: 33 }
    },
    portrait: {
      weight: 14, rows: 14, x: [8, 10], portrait: true,
      art: [
        "   /\\                    /\\",
        "  /  \\                  /  \\",
        " |    \\                /    |",
        " |     \\    MMMMMM    /     |",
        "  \\     '.__MMMMMM__.'     /",
        "   '.     /        \\     .'",
        "     '-._|  E    E  |_.-'",
        "         |          |",
        "         |          |",
        "          \\  .--.  /",
        "          | ( oo ) |",
        "           \\ '--' /",
        "       .----'----'----.",
        "      /                \\"
      ]
    },
    foal: {
      weight: 12, rows: 9, x: [3, 22], props: true, back: 3,
      art: [
        "            /| /|",
        "           / |/ |",
        "          /      \\_",
        "    _____.'  E     '.",
        "  .'    MM      _  o )",
        " ~|     MM   .-' '--'",
        "  |   ____   |",
        "  |  |    |  |",
        "  |__|    |__|"
      ],
      fly: { row: 2, col: 23 }
    }
  };
  var POSE_NAMES = Object.keys(POSES);
  function pickPose() {
    var total = 0, i;
    for (i = 0; i < POSE_NAMES.length; i++) total += POSES[POSE_NAMES[i]].weight;
    var n = Math.random() * total;
    for (i = 0; i < POSE_NAMES.length; i++) {
      n -= POSES[POSE_NAMES[i]].weight;
      if (n < 0) return POSE_NAMES[i];
    }
    return POSE_NAMES[0];
  }

  /* ---------- scenery ---------- */
  var SUN   = [" \\ | /", "- (_) -", " / | \\"];
  var MOON  = ["  .-,", " (  (", "  '-'"];
  var CLOUD = ["   .--.", " .(    ).", "(___.___)"];
  var PROPS = [
    [".------.", "|//////|", "'------'"],                                  // hay bale
    ["|--|--|--|", "|--|--|--|", "|  |  |  |"],                             // fence
    ["  .@@@.", " @@@@@@@", "  '@@@'", "    |", "    |"],                  // tree
    ["  ___", " |   |", " |oat|", " '---'"],                              // feed bucket
    [" \\|/", "--@--", "  |", " \\|"]                                      // tall flower
  ];

  function scenery(g, pose, night) {
    if (pose.props && chance(0.75)) {
      var prop = pick(PROPS);
      place(g, prop, GROUND - prop.length, GROUND - prop.length, 2);
    }
    if (night) {
      place(g, MOON, 0, 1, 1);
      for (var i = 0; i < 16; i++) {
        var r = rand(0, 5), c = rand(0, W - 1);
        if (free(g, r, c, 1, 1, 3)) g[r][c] = pick(['*', '.', '+', '.', "'"]);
      }
    } else {
      var kind = pick(['sun', 'sun', 'cloud', 'both', 'two', 'none']);
      if (kind === 'sun' || kind === 'both') place(g, SUN, 0, 1, 1);
      if (kind !== 'sun' && kind !== 'none') place(g, CLOUD, 0, 1, 2);
      if (kind === 'two') place(g, CLOUD, 0, 2, 2);
      if (chance(0.35)) place(g, ["v  v"], 1, 4, 3);
    }
    for (var c2 = 0; c2 < W; c2++) {
      g[GROUND][c2] = pick(['"', '"', '"', ',', ',', '.']);
      if (chance(0.12)) g[GROUND + 1][c2] = pick(['.', ',', "'"]);
    }
  }

  /* ---------- extras ---------- */
  function extras(g, pose, top, ox) {
    var list = [];
    if (pose.portrait) {
      var hat = pick(['straw', 'top', 'crown', null, null, null]);
      if (hat === 'straw') put(g, top + 2, ox + 8, ["   .------.", "_.'--------'._"], true);
      if (hat === 'top') put(g, top, ox + 10, [" .------.", " |      |", " |======|", "_|______|_"], true);
      if (hat === 'crown') put(g, top + 3, ox + 12, ["@*@*@*"], true);
      if (hat) list.push(hat);
      if (chance(0.3)) {
        var row = g[top + 6];
        put(g, top + 6, ox + 10, ["-(" + row[ox + 12] + ")--(" + row[ox + 17] + ")-"], true);
        list.push('specs');
      }
      if (chance(0.3)) { put(g, top + 12, ox + 12, ["{>o<}"], true); list.push('bowtie'); }
      return list;
    }
    if (pose.back !== undefined && pose !== POSES.foal) {
      var load = pick(['blanket', 'blanket', 'baskets', null, null, null, null]);
      if (load === 'blanket') put(g, top + pose.back + 1, ox + 10, ["|::::::|", " '~~~~'"], true);
      if (load === 'baskets') put(g, top + pose.back + 1, ox + 9, ["|######|", "|######|", "'------'"], true);
      if (load) list.push(load);
    }
    if (pose.back !== undefined && chance(0.22)) {
      put(g, top + pose.back - 1, ox + (pose === POSES.foal ? 5 : 12), ["('>"]);
      list.push('bird');
    }
    if (pose.mouth && chance(0.25)) {
      put(g, top + pose.mouth.row, ox + pose.mouth.col, ["-<@"]);
      list.push('flower');
    } else if (pose.fly && chance(0.2)) {
      put(g, top + pose.fly.row, ox + pose.fly.col, ["}|{"]);
      list.push('butterfly');
    }
    return list;
  }

  /* ---------- mirroring ---------- */
  var SWAP = { '/': '\\', '\\': '/', '(': ')', ')': '(', '<': '>', '>': '<', '{': '}', '}': '{' };
  function mirror(g) {
    return g.map(function (row) {
      return row.slice().reverse().map(function (ch) { return SWAP[ch] || ch; });
    });
  }

  /* ---------- names and captions ---------- */
  var NAMES = ["Clementine", "Bartholomew", "Juniper", "Winifred", "Augustin", "Marigold", "Thaddeus",
    "Beatrix", "Cornelius", "Philippa", "Ignatius", "Rosalind", "Barnaby", "Ottoline", "Leopold",
    "Henrietta", "Montgomery", "Persimmon", "Algernon", "Dulcinea", "Sancho", "Figaro", "Esmeralda",
    "Horatio", "Mirabelle", "Tobias", "Wilhelmina", "Fitzgerald", "Odalys", "Benedetto"];
  var DOING = {
    standing: ["contemplating oats", "in repose", "awaiting the post", "considering the horizon",
      "at the edge of the meadow", "unbothered", "after a long day", "with quiet dignity",
      "pretending not to notice you", "thinking about hay", "having declined to move"],
    grazing: ["at luncheon", "sampling the clover", "among the good grass", "taking a light supper",
      "inspecting the lawn", "dining alone", "reviewing the meadow"],
    resting: ["reclining", "at rest", "declining all invitations", "after luncheon",
      "observing a day of rest", "not to be disturbed", "in the long grass"],
    sitting: ["seated", "awaiting an explanation", "sitting for the artist", "at the recital",
      "holding the floor", "politely unconvinced"],
    portrait: ["a formal portrait", "study of the head", "facing the viewer", "full face",
      "the official likeness", "self-possessed"],
    foal: ["a young talent", "early work", "at four months", "the debutante", "small but certain",
      "first season"],
    night: ["by moonlight", "beneath the stars", "keeping late hours", "nocturne"],
    bird: ["with a small friend", "and companion"],
    flower: ["bearing a flower", "feeling romantic"],
    butterfly: ["with visitor", "and the butterfly"],
    blanket: ["in formal dress", "dressed for the occasion"],
    baskets: ["returning from market", "bearing provisions"],
    straw: ["in a good straw hat", "dressed for the garden party"],
    top: ["in evening dress", "on the way to the opera"],
    crown: ["crowned with flowers", "queen of the May"],
    specs: ["the scholar", "reading the fine print"],
    bowtie: ["black tie", "dressed for dinner"]
  };

  function generate() {
    var poseName = pickPose();
    var pose = POSES[poseName];
    var top = GROUND - pose.rows;
    var ox = rand(pose.x[0], pose.x[1]);
    var night = chance(0.3);
    var g = blank();

    // body
    var eye = pick(EYES), mane = pick(MANES);
    put(g, top, ox, pose.art.map(function (line) {
      return line.replace(/MM/g, mane).replace(/E/g, eye);
    }));
    if (pose.ears) put(g, top + pose.ears.row, ox + pose.ears.col, pick(pose.ears.set));
    if (pose.legs) put(g, top + pose.legs.row, ox + pose.legs.col, pick(pose.legs.set), true);
    if (pose.tail) put(g, top + pose.tail.row, ox, pick(pose.tail.set));

    var ex = extras(g, pose, top, ox);
    scenery(g, pose, night);
    if (chance(0.5)) g = mirror(g);

    // caption
    var pool = DOING[poseName];
    if (night && chance(0.4)) pool = DOING.night;
    if (ex.length && chance(0.6)) pool = DOING[pick(ex)];
    var number = String(1 + Math.floor(Math.random() * 9999)).padStart(4, '0');

    return {
      pose: poseName,
      text: g.map(function (row) { return row.join('').replace(/\s+$/, ''); }).join('\n'),
      title: pick(NAMES) + ', ' + pick(pool),
      meta: 'No. ' + number + ' \u00b7 ASCII on screen'
    };
  }

  return { generate: generate, W: W, H: H };
})();

/* ============================================================
   Page behaviour
   ============================================================ */
if (typeof document !== 'undefined') {
  (function () {
    var pre = document.getElementById('donkey');
    var frame = document.getElementById('frame');
    var title = document.getElementById('title');
    var meta = document.getElementById('meta');
    var copy = document.getElementById('copy');
    var busy = false, current = null;

    function show() {
      current = ASSCII.generate();
      // pad rows so the frame keeps a constant size
      pre.textContent = current.text.split('\n').map(function (l) {
        return l.padEnd(ASSCII.W, ' ');
      }).join('\n');
      title.textContent = current.title;
      meta.textContent = current.meta;
    }

    function next() {
      if (busy) return;
      var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!pre.animate) { show(); return; }
      busy = true;
      var D = calm ? 400 : 850;
      var frames = calm
        ? [{ opacity: 1 }, { opacity: 0, offset: 0.5 }, { opacity: 1 }]
        : [
            { transform: 'rotate(0deg) scale(1)', opacity: 1 },
            { transform: 'rotate(360deg) scale(0.12)', opacity: 0.2, offset: 0.5 },
            { transform: 'rotate(720deg) scale(1)', opacity: 1 }
          ];
      var anim = pre.animate(frames, { duration: D, easing: 'ease-in-out' });
      setTimeout(show, D / 2);
      anim.onfinish = anim.oncancel = function () { busy = false; };
    }

    frame.addEventListener('click', next);

    copy.addEventListener('click', function () {
      if (!current) return;
      var done = function (msg) {
        copy.textContent = msg;
        setTimeout(function () { copy.textContent = 'copy this one'; }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(current.text).then(
          function () { done('copied'); },
          function () { done('copy failed'); }
        );
      } else {
        done('copy unavailable');
      }
    });

    show();
  })();
}
if (typeof module !== 'undefined') { module.exports = ASSCII; }
</script>
</body>
</html>
